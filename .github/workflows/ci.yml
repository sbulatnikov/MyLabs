# Тесты на заглушках API игры, обычная и отладочная сборка, упаковка в .pak.
# Шаги общие для всех аддонов: https://github.com/sbulatnikov/allods-addon-ci
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # те же проверки и сборка — перед выпуском (release.yml)

jobs:
  test:
    uses: sbulatnikov/allods-addon-ci/.github/workflows/ci.yml@v1
    with:
      apt: librsvg2-bin luajit
      pip: numpy pillow
      # Тесты MyLabs сами собирают аддон: генератор кладёт его в <папка>/MyLabs
      test: |
        sh test/run.sh out
        ALLODS_DEBUG=1 sh test/run.sh out/debug
      build: python gen/assemble.py out
      build-debug: python gen/assemble.py out/debug
